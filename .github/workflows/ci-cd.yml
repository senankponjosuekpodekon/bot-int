name: CI/CD

on:
  push:
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_int_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bot_int_test
      JWT_SECRET: ci-test-secret
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Build payment-sdk
        run: npm run build -w @stiamond/payment-sdk

      - name: Type check
        run: |
          cd apps/api && npx tsc --noEmit -p tsconfig.json
          cd ../web && npx tsc --noEmit -p tsconfig.json

      - name: Run API tests
        run: |
          cd apps/api && npx jest --passWithNoTests --forceExit

      - name: Build API
        run: cd apps/api && npx nest build

      - name: Build Web
        run: cd apps/web && npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  docker-build:
    needs: lint-test-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: stiamond-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: stiamond-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
