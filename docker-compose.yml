version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stiamond_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stiamond
      POSTGRES_PASSWORD: stiamond123
      POSTGRES_DB: stiamond_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stiamond_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: stiamond
      DB_PASSWORD: stiamond123
      DB_NAME: stiamond_agent
      JWT_SECRET: changeme_secret_in_production
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2
    ports:
      - '3001:3001'

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: stiamond_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
